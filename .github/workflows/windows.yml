name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare build environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt
      - name: Protocol and validation tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Phone gesture tests
        run: node --test tests/gestures.test.cjs tests/phone.test.cjs
      - name: Build portable Windows archive
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Check packaged runtime
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\TouchFlow.exe -ArgumentList '--self-test', 'smoke-ci.json' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Packaged self-test failed' }
          $result = Get-Content smoke-ci.json | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw 'Invalid packaged self-test result' }
      - uses: actions/upload-artifact@v4
        with:
          name: TouchFlow-windows-x64
          path: |
            dist/TouchFlow-*-windows-x64.zip
            dist/SHA256SUMS.txt
